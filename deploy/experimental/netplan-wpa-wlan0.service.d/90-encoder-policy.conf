# Experimental: do not install before migration and recovery integration.
# Keeps Netplan's device ordering; replaces only the wlan0 supplicant launch.
[Service]
User=root
Group=root
RuntimeDirectory=encoder-wifi-policy
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
UMask=0077
LimitCORE=0
TimeoutStartSec=15s
ExecStartPre=/opt/encoder/bin/encoder-wifi-policy-guard --stage
ExecStart=
ExecStart=/sbin/wpa_supplicant -c /run/encoder-wifi-policy/wpa-wlan0.conf -iwlan0 -Dnl80211,wext
# Reload cannot bypass preparation: the adapter must use restart.
ExecReload=
